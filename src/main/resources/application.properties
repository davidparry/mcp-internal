spring.application.name=mcp-internal

spring.main.banner-mode=off

# Server port
server.port=8080

# Git MCP Configuration
mcp.git.enabled=${GIT_MCP_ENABLED:true}
# SSH key configuration for multiple Git hosts
# Default SSH key file name (in ~/.ssh/)
mcp.git.ssh.default-key=${GIT_SSH_DEFAULT_KEY:aws_ecdsa}
# Host-to-key mappings (comma-separated, format: host=keyfile)
# Example: github.com=github_key,ssh.dev.azure.com=azure_key
# Leave empty to use ~/.ssh/config for host-based key selection
mcp.git.ssh.host-keys=${GIT_SSH_HOST_KEYS:github.com=aws_ecdsa,ssh.dev.azure.com=id_ado_rsa}

# Jira MCP Configuration
mcp.jira.enabled=${JIRA_MCP_ENABLED:true}
mcp.jira.site-url=${JIRA_SITE_URL:}
mcp.jira.email=${JIRA_EMAIL:}
mcp.jira.api-token=${JIRA_API_TOKEN:}

# Terminal MCP Configuration
mcp.terminal.enabled=${TERMINAL_MCP_ENABLED:true}
mcp.terminal.blocked=${TERMINAL_BLOCKED:":(){:|:&};:,kill"}
mcp.terminal.default-timeout-seconds=${TERMINAL_DEFAULT_TIMEOUT_SECONDS:180}

mcp.github.enabled=${GITHUB_MCP_ENABLED:true}
mcp.github.api-token=${GITHUB_API_TOKEN:}

# Snyk MCP Configuration
mcp.snyk.enabled=${SNYK_MCP_ENABLED:true}
mcp.snyk.api-token=${SNYK_API_TOKEN:}

# Confluence MCP Configuration
mcp.confluence.enabled=${CONFLUENCE_MCP_ENABLED:true}
mcp.confluence.site-url=${JIRA_SITE_URL:}
mcp.confluence.email=${JIRA_EMAIL:}
mcp.confluence.api-token=${JIRA_API_TOKEN:}

# Azure DevOps MCP Configuration
mcp.azure-devops.enabled=${AZURE_DEVOPS_MCP_ENABLED:true}
mcp.azure-devops.organization-url=${AZURE_DEVOPS_ORGANIZATION_URL:}
mcp.azure-devops.personal-access-token=${AZURE_DEVOPS_PAT:}
mcp.azure-devops.default-project=${AZURE_DEVOPS_DEFAULT_PROJECT:qodo-code}



# MCP Server Configuration
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.request-timeout=120s
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

# MCP Server Info
spring.ai.mcp.server.name=mcp-internal-server
spring.ai.mcp.server.version=1.0.4

# Authentication
mcp.auth.bearer-token=${MCP_AUTH_TOKEN:DAVIDSUPERSECRETTOKEN}

# Default root path fallback (used when client doesn't provide roots)
mcp.default-root-path=${MCP_DEFAULT_ROOT_PATH:}

# Actuator - health/readiness/liveness probes for ECS/EKS
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Logging
logging.level.org.springframework.ai.mcp=DEBUG
logging.level.ai.qodo.mcp=DEBUG
# Atlassian Jira REST client + underlying HTTP layer — surface transport-level
# failures (DNS / SSL / auth / proxy) that otherwise vanish into an empty
# RestClientException{statusCode=Optional.absent(), errorCollections=[]}.
logging.level.com.atlassian.jira.rest.client=DEBUG
logging.level.org.apache.http=INFO
logging.level.org.apache.hc=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n